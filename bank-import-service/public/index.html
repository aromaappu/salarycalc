<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bank Statement Upload</title>
  </head>
  <body>
    <div class="uploader">
      <div id="dropzone" class="dropzone">Drag & drop PDF here or click to select</div>
      <input id="fileInput" type="file" name="statement" accept="application/pdf" hidden />
      <div id="progress" class="progress" aria-hidden="true"></div>
    </div>
    <div id="summary" class="summary" hidden>
      <h3>Import Summary</h3>
      <pre id="result"></pre>
    </div>
    <script src="/public/app.js"></script>
  </body>
</html>
